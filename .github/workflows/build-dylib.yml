name: Build DSHPet

on:
  workflow_dispatch:
  push:
    paths:
      - 'DSHPet/**'
      - 'App/**'
      - 'Respring/**'
      - 'Tweak.xm'
      - 'Makefile'
      - 'control'
      - 'DSHPet.plist'
      - '.github/workflows/build-dylib.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: brew install ldid xz make dpkg || true

      - name: Setup Theos
        run: |
          set -e
          rm -rf "$RUNNER_TEMP/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/theos/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/theos/sdks"
          curl -fL --retry 3 -o "$RUNNER_TEMP/sdk.tar.xz" \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xf "$RUNNER_TEMP/sdk.tar.xz" -C "$RUNNER_TEMP/theos/sdks"
          ls "$RUNNER_TEMP/theos/sdks"

      # tweak + setuid 助手（dshpet-respring 是同一个 Theos 项目的 tool target）
      - name: Build tweak and helper
        run: |
          set -e
          export PATH="$THEOS/bin:$PATH"
          chmod +x layout/DEBIAN/postinst || true
          gmake clean || true
          gmake package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless DEBUG=0

      # 安装器 App 的 Shared/ 是编译时拼出来的，不入库
      - name: Build installer app
        run: |
          set -e
          export PATH="$THEOS/bin:$PATH"
          mkdir -p App/Shared
          cp DSHPet/*.h DSHPet/*.m App/Shared/
          cd App
          gmake clean || true
          gmake package FINALPACKAGE=1 DEBUG=0

      - name: Collect binaries
        run: |
          set -e
          mkdir -p out
          find .theos -name 'DSHPet.dylib' -type f -exec cp {} out/ \;
          find .theos -name 'dshpet-respring' -type f -exec cp {} out/ \;
          find App/.theos -name 'DSHPet' -type f -path '*.app/*' -exec cp {} out/DSHPet_app \;
          ls -la out
          echo "=== dylib ==="
          lipo -info out/DSHPet.dylib
          otool -l out/DSHPet.dylib | grep -c LC_DYLD_CHAINED_FIXUPS || true
          otool -v -s __TEXT __objc_methlist out/DSHPet.dylib | head -n 3 || true
          echo "=== helper ==="
          lipo -info out/dshpet-respring
          echo "=== app ==="
          lipo -info out/DSHPet_app || true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete dshpet-build --yes --cleanup-tag || true
          gh release create dshpet-build out/DSHPet.dylib out/dshpet-respring out/DSHPet_app \
            --title "DSHPet build artifacts" \
            --notes "dylib (arm64+arm64e, chained fixups) / setuid helper / installer app"
